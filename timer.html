<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Timer | StudyPilot AI</title><link rel="stylesheet" href="style.css"></head><body><div class="app-shell"><aside class="sidebar"><div><a class="brand" href="index.html"><span class="brand-mark">S</span><span>StudyPilot <b>AI</b></span></a><nav><a class="nav-link" href="index.html"><span>⌂</span> Dashboard</a><a class="nav-link" href="planner.html"><span>▣</span> Planner</a><a class="nav-link" href="ai-planner.html"><span>✦</span> AI Planner</a><a class="nav-link" href="progress.html"><span>◒</span> Progress</a><a class="nav-link active" href="timer.html"><span>◷</span> Timer</a></nav></div><div class="sidebar-footer"><button class="theme-btn" id="themeBtn" onclick="toggleTheme()">☀️</button><span>Focus mode</span></div></aside><main class="main-content"><header class="topbar"><div><p class="eyebrow">DEEP WORK</p><h1>Focus Timer</h1><p class="muted">Use a simple Pomodoro session, then take a proper break.</p></div></header><section class="timer-layout"><article class="timer-card panel"><span class="pill">FOCUS SESSION</span><div id="timer" class="timer-display">25:00</div><p class="muted">Stay away from distractions until the timer ends.</p><div class="timer-actions"><button class="button" onclick="startTimer()">▶ Start</button><button class="button button-ghost" onclick="resetTimer()">↺ Reset</button></div></article><article class="music-player panel"><div class="panel-head"><div><p class="eyebrow">STUDY SOUNDS</p><h2>Lo-fi player 🎧</h2></div></div><p id="songName" class="music-title">No song playing</p><div class="timer-actions"><button class="button" onclick="playMusic()">▶ Play</button><button class="button button-ghost" onclick="pauseMusic()">⏸ Pause</button><button class="button button-ghost" onclick="nextSong()">⏭ Next</button></div><label class="volume-label">Volume <input id="volume" type="range" min="0" max="1" step="0.01" value="0.5" oninput="audio.volume=this.value"></label></article></section></main></div><script src="script.js"></script></body></html>
